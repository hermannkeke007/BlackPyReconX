<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlackPyReconX - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="icon" href="{{ url_for('static', filename='assets/favicon.svg') }}" type="image/svg+xml">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            width: 280px;
            padding: 20px;
            background-color: #343a40;
            color: white;
        }
        .sidebar .nav-link {
            color: #adb5bd;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .sidebar .nav-link.active, .sidebar .nav-link:hover {
            color: #ffffff;
            background-color: #495057;
            border-radius: 5px;
        }
        .sidebar .nav-link .bi {
            margin-right: 15px;
        }
        .sidebar .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .sidebar .logo h3 {
            margin: 0;
            color: #fff;
        }
        .content {
            margin-left: 280px;
            padding: 30px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">
            <h3><i class="bi bi-shield-shaded"></i> BlackPyReconX</h3>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link {% if request.path == url_for('index') %}active{% endif %}" href="{{ url_for('index') }}"><i class="bi bi-house-door-fill"></i> Tableau de Bord</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == url_for('recon') %}active{% endif %}" href="{{ url_for('recon') }}"><i class="bi bi-search"></i> Reconnaissance</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == url_for('web') %}active{% endif %}" href="{{ url_for('web') }}"><i class="bi bi-globe"></i> Analyse Web</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == url_for('exploit') %}active{% endif %}" href="{{ url_for('exploit') }}"><i class="bi bi-lightning-charge-fill"></i> Exploitation</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == url_for('utils_page') %}active{% endif %}" href="{{ url_for('utils_page') }}"><i class="bi bi-tools"></i> Utilitaires</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == url_for('reports') %}active{% endif %}" href="{{ url_for('reports') }}"><i class="bi bi-file-earmark-text-fill"></i> Rapports</a>
            </li>
            <li class="nav-item">
                <a class="nav-link {% if request.path == url_for('configure_report') %}active{% endif %}" href="{{ url_for('configure_report') }}"><i class="bi bi-gear-fill"></i> Configuration</a>
            </li>
        </ul>
    </div>

    <div class="content">
        <div class="container-fluid">
            {% block content %}{% endblock %}
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
